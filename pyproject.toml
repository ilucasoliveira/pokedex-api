[project]
name = "projeto-final-ebac"
version = "0.1.0"
description = "criando uma API inspirada na PokéAPI utilizando CRUD, FastAPI, SQLAlchemy e Docker."
authors = [
    {name = "Lucas de Oliveira Pimentel",email = "lucasoliveirapimentel.dev@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)"
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]