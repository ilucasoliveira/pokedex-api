# Blueprint do Render: cria a API, o front-end (site estático), o PostgreSQL e o
# Redis (Key Value) de uma vez.
# API: o deploy automático do Render fica desligado; quem dispara o deploy é o
# GitHub Actions, depois que os testes passam (job "deploy" do ci.yml).
# Front-end: o Render publica sozinho, mas só quando os checks do CI passam.

services:
  - type: web
    name: pokedex-api
    runtime: docker
    # Caminhos relativos à raiz do repositório: a API mora em backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pokedex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pokedex-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      # Endereço do front-end publicado (lista separada por vírgula). Fica em
      # branco no Blueprint e é preenchido no painel do Render; sem ele, a API
      # só libera o Vite local (http://localhost:5173).
      - key: CORS_ORIGINS
        sync: false

  # Front-end Rota151: site estático (gratuito, servido por CDN). Os caminhos
  # abaixo são relativos ao rootDir; mudanças fora de frontend/ não geram build.
  - type: web
    name: rota151
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Publica só depois que o CI (lint, testes e build do front) passar.
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://pokedex-api-cb8d.onrender.com
    routes:
      # SPA: qualquer caminho sem arquivo (ex.: /pokemon/25) recebe o index.html,
      # e o React Router resolve a rota. Arquivos existentes não são afetados.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Arquivos do build têm hash no nome: podem ficar em cache para sempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # App instalável (PWA): o service worker e o manifest precisam ser
      # conferidos a cada visita, senão as atualizações demoram a chegar.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: keyvalue
    name: pokedex-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: pokedex-db
    plan: free
    region: oregon
    databaseName: pokedex
    user: pokedex
