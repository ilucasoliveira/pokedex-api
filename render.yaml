# Blueprint do Render: cria a API, o PostgreSQL e o Redis (Key Value) de uma vez.
# O deploy automático do Render fica desligado: quem dispara o deploy é o
# GitHub Actions, depois que os testes passam (job "deploy" do ci.yml).

services:
  - type: web
    name: pokedex-api
    runtime: docker
    # Caminhos relativos à raiz do repositório: a API mora em backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pokedex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pokedex-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  - type: keyvalue
    name: pokedex-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: pokedex-db
    plan: free
    region: oregon
    databaseName: pokedex
    user: pokedex
