services:
  db:
    image: postgres:18
    container_name: pokedex-db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: pokedex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: pokedex-app
    ports:
      - "8000:8000"
    # O .env fica na raiz do repositório, fora da pasta montada em /app.
    # As variáveis de "environment" têm prioridade sobre as do env_file.
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aplica as migrações antes de subir a API, como no Dockerfile.
    command:
      [
        "sh",
        "-c",
        "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

volumes:
  pgdata:
